# Drop-in for klutchell/unbound (loaded via include-toplevel from
# /etc/unbound/custom.conf.d/). The base image already provides a recursive,
# DNSSEC-validating config with root hints, root.key, local-only access-control
# and private-address protection; we only override the listening port.
server:
    # The image default binds interface 0.0.0.0 with no port; setting the port
    # here makes Unbound listen on 0.0.0.0:5335 instead of :53, so it does not
    # collide with Pi-hole's :53 and is reachable as upstream 127.0.0.1#5335.
    port: 5335
    # This LAN is IPv4-only for DNS.
    do-ip6: no
    # Allow Plex's *.plex.direct hostnames to return private LAN IPs.
    # Without this, the image's private-address (DNS-rebind) protection
    # strips the private answer and Plex apps cannot open a secure
    # connection to the local server ("unable to connect securely").
    private-domain: "plex.direct"
